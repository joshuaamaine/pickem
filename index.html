td.big{font:800 20px var(--display)}
.wins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.wins li{display:flex;gap:12px;align-items:baseline;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.wins .wn{font:800 16px var(--display);text-transform:uppercase;color:var(--muted);flex:0 0 auto}
.stack{display:flex;flex-direction:column;gap:12px}
.cm-row{display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.cm-row .meta{margin:0}
.cm-row .meta b{font:800 17px var(--display);color:var(--ink);letter-spacing:.02em}
.seg{display:flex;gap:6px}
.seg button{flex:1 1 0;min-width:0;padding:9px 6px;border-radius:8px;border:1.5px solid var(--line);background:var(--sunk);font:800 16px/1 var(--display);letter-spacing:.04em}
.seg button.on{background:var(--tc,var(--ink));border-color:var(--tc,var(--ink));color:var(--tf,var(--bg))}
.pl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pl .who{display:flex;flex-direction:column}
.pl .acts{display:flex;gap:6px;flex:0 0 auto}
.pl .btn{padding:8px 10px;font-size:13px}
.flash{margin:0 0 14px;padding:10px 12px;border-radius:10px;background:var(--good-bg);color:var(--good);font-weight:600;font-size:13.5px}
.cm-count{margin:16px 0 0;font-size:13px;color:var(--muted)}
@media (max-width:380px){.brand{font-size:56px}.tm .ab{font-size:24px}.go{padding:12px 12px;font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.idrow{display:grid;grid-template-columns:minmax(0,1fr) 108px;gap:10px}
.idnote{margin:8px 0 0}
.bar-msg.bad{color:var(--bad)}
.hidden-picks{margin:2px 0 4px;font-size:13px;color:var(--muted)}
.loading{padding-block:22px}
.idrow{grid-template-columns:minmax(0,1fr) 96px}
.selwrap{position:relative}
.selwrap select{appearance:none;-webkit-appearance:none;padding-right:38px;text-overflow:ellipsis}
.selwrap::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.tm-sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
</style>

<script>

var TEAMS={ARI:["Cardinals","#97233F","#FFFFFF"],ATL:["Falcons","#A71930","#FFFFFF"],BAL:["Ravens","#241773","#FFFFFF"],BUF:["Bills","#00338D","#FFFFFF"],CAR:["Panthers","#0085CA","#FFFFFF"],CHI:["Bears","#0B162A","#FFFFFF"],CIN:["Bengals","#FB4F14","#111111"],CLE:["Browns","#311D00","#FFFFFF"],DAL:["Cowboys","#003594","#FFFFFF"],DEN:["Broncos","#FB4F14","#0A2343"],DET:["Lions","#0076B6","#FFFFFF"],GB:["Packers","#203731","#FFB612"],HOU:["Texans","#03202F","#FFFFFF"],IND:["Colts","#002C5F","#FFFFFF"],JAC:["Jaguars","#006778","#FFFFFF"],KC:["Chiefs","#E31837","#FFFFFF"],LV:["Raiders","#101010","#C9CED1"],LAC:["Chargers","#0080C6","#FFFFFF"],LA:["Rams","#003594","#FFD100"],MIA:["Dolphins","#008E97","#FFFFFF"],MIN:["Vikings","#4F2683","#FFC62F"],NE:["Patriots","#002244","#FFFFFF"],NO:["Saints","#D3BC8D","#101820"],NYG:["Giants","#0B2265","#FFFFFF"],NYJ:["Jets","#125740","#FFFFFF"],PHI:["Eagles","#004C54","#FFFFFF"],PIT:["Steelers","#FFB612","#101820"],SF:["49ers","#AA0000","#FFFFFF"],SEA:["Seahawks","#002244","#69BE28"],TB:["Buccaneers","#D50A0A","#FFFFFF"],TEN:["Titans","#0C2340","#FFFFFF"],WAS:["Commanders","#5A1414","#FFB612"]};
var app=document.getElementById("app");

function W(n){return S.weeks[String(n==null?S.currentWeek:n)]}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function tm(c){var t=TEAMS[c]||[c,"#55605B","#FFFFFF"];return {code:c,name:t[0],bg:t[1],fg:t[2]}}

function locked(g){return Date.now()>=Date.parse(g.kickoff)}
function fmtDay(iso){return new Date(iso).toLocaleDateString([], {weekday:"long",month:"short",day:"numeric"})}
function fmtShortDay(iso){return new Date(iso).toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"})}
function fmtShort(iso){return new Date(iso).toLocaleDateString([], {month:"short",day:"numeric"})}
function fmtTime(iso){return new Date(iso).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}
function tbGame(wk){for(var i=0;i<wk.games.length;i++){if(wk.games[i].id===wk.tiebreaker)return wk.games[i]}return null}

/* ---------- database ---------- */
function initDb(){
  if(!/^https:\/\//.test(SUPABASE_URL)||!SUPABASE_KEY||SUPABASE_KEY.indexOf("%%")===0){DB.err="setup";return}

async function loadDb(){
  if(!db)return;
  try{
    var pr=await db.from("player_names").select("id,name");
    if(pr.error)throw pr.error;

    for(;;){
      var r=await db.from("pick_log").select("id,player_id,week,game_id,pick,created_at").eq("season",S.season).order("id",{ascending:true}).range(from,from+999);

    var pl={};(pr.data||[]).forEach(function(p){pl[p.id]=p.name});

function lockAt(wk,gid){
  if(gid==="tb"){var tg=tbGame(wk);return tg?Date.parse(tg.kickoff):Infinity}

/* Each person's picks for a week: the latest pick saved before that game kicked off. */
function weekEntries(n){
  var wk=W(n),byId={};

    if(r.week!==n)return;
    if(Date.parse(r.created_at)>=lockAt(wk,r.game_id))return;
    var o=byId[r.player_id]||(byId[r.player_id]={p:{},tb:null});

  Object.keys(byId).forEach(function(id){out[DB.players[id]||"Someone"]=byId[id]});

  Object.keys(manual).forEach(function(name){
    var dup=Object.keys(out).filter(function(k){return nkey(k)===nkey(name)})[0];
    if(!dup)out[name]=manual[name];
  });

}
function playerIdFor(name){var k=nkey(name);if(!k)return null;var ids=Object.keys(DB.players);for(var i=0;i<ids.length;i++){if(nkey(DB.players[ids[i]])===k)return ids[i]}return null}

  wk.games.forEach(function(g){if(!locked(g)&&draft.p[g.id]&&draft.p[g.id]!==sv.p[g.id])diff=true});
  var tg=tbGame(wk);
  if(tg&&!locked(tg)&&draft.tb!==""&&Number(draft.tb)!==sv.tb)diff=true;
  return diff;
}

/* ---------- scoring ---------- */
function standings(n){
  var wk=W(n),entries=weekEntries(n);
  var decided=wk.games.filter(function(g){return g.winner}).length;
  var fin=decided===wk.games.length;
  var rows=Object.keys(entries).map(function(name){
    var e=entries[name],c=0,x=0,open=0;
    wk.games.forEach(function(g){var p=e.p[g.id];if(!p)return;if(!g.winner){open++;return}if(p===g.winner)c++;else x++});
    var diff=(wk.mnfTotal!=null&&e.tb!=null&&e.tb!=="")?Math.abs(Number(e.tb)-wk.mnfTotal):null;
    return {name:name,c:c,x:x,open:open,tb:e.tb,diff:diff,n:pickedCount(wk,e.p)};
  });
  function dv(r){return r.diff==null?1e9:r.diff}
  rows.sort(function(a,b){if(b.c!==a.c)return b.c-a.c;if(dv(a)!==dv(b))return dv(a)-dv(b);return a.name.localeCompare(b.name)});
  rows.forEach(function(r,i){if(i===0){r.rank=1;return}var p=rows[i-1];r.rank=(p.c===r.c&&dv(p)===dv(r))?p.rank:i+1});
  var winners=fin&&rows.length?rows.filter(function(r){return r.rank===1}).map(function(r){return r.name}):[];
  return {wk:wk,entries:entries,rows:rows,decided:decided,fin:fin,winners:winners};
}
function season(){
  var m={},ww=[];
  Object.keys(S.weeks).map(Number).sort(function(a,b){return a-b}).forEach(function(n){
    var st=standings(n);
    st.rows.forEach(function(r){var k=nkey(r.name);var o=m[k]||(m[k]={name:r.name,c:0,x:0,wins:0});o.name=r.name;o.c+=r.c;o.x+=r.x});
    if(st.fin&&st.winners.length){st.winners.forEach(function(w){m[nkey(w)].wins++});ww.push({n:n,names:st.winners,c:st.rows[0].c,of:st.wk.games.length})}
  });
  var rows=Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.c-a.c||b.wins-a.wins||a.name.localeCompare(b.name)});
  return {rows:rows,ww:ww};
}
function buildMsg(){
  var wk=W(),codes=wk.games.filter(function(g){return draft.p[g.id]}).map(function(g){return draft.p[g.id]});
  var s="🏈 Week "+S.currentWeek+" picks, "+draft.name.trim()+"\n"+codes.join(", ");
  var tg=tbGame(wk);
  if(draft.tb!==""&&tg)s+="\n"+(tg.slot==="MNF"?"MNF total: ":"Tiebreaker total: ")+draft.tb;
  return s;
}

/* ---------- rendering ---------- */
function weekRange(wk){var x=fmtShort(wk.games[0].kickoff),y=fmtShort(wk.games[wk.games.length-1].kickoff);return x===y?x:x+" to "+y}
function renderShell(){
  var wk=W();
  app.innerHTML='<div class="wrap">'+
    '<header class="hd"><p class="eyebrow">'+S.season+' NFL season · group chat pool</p><h1 class="brand">Pick’em</h1>'+
    '<p class="wkline"><span class="wkno">Week '+S.currentWeek+'</span><span>'+esc(weekRange(wk))+'</span><span>'+wk.games.length+' games</span>'+(wk.byes&&wk.byes.length?'<span>On bye: '+esc(wk.byes.join(", "))+'</span>':'')+'</p>'+
    '<div class="hash" aria-hidden="true"></div></header>'+
    '<nav class="tabs" role="tablist" id="tabs"></nav>'+
    '<main id="view"></main></div><div id="bar"></div><div id="layer"></div>';
  renderTabs();renderView();renderBar();renderLayer();
}
function renderTabs(){
  var nav=document.getElementById("tabs");if(!nav)return;
  nav.innerHTML=[["picks","Picks"],["board","Board"],["season","Season"]].map(function(x){return '<button type="button" class="tab" role="tab" data-tab="'+x[0]+'" aria-selected="'+(tab===x[0])+'">'+x[1]+'</button>'}).join("");
}
function renderView(){
  var v=document.getElementById("view");if(!v)return;
  v.innerHTML=tab==="board"?viewBoard():tab==="season"?viewSeason():viewPicks();
}
function whoNote(){
  if(!DB.loaded||!draft.name.trim())return "";
  return playerIdFor(draft.name)?'Welcome back. Enter your PIN to save changes.':'New here? Pick any 4 digits. You’ll need this PIN to change your picks later.';
}
function viewPicks(){
  var wk=W();
  var h='<p class="lede">Tap who you think wins each game, then save. You can change any pick until that game kicks off.</p>';
  h+='<div class="idrow"><div class="idname"><label class="lbl" for="pk-name">Who are you?</label><div class="selwrap"><select class="field" id="pk-name"><option value="">Choose your name</option>'+roster().map(function(m){return '<option value="'+esc(m.name)+'"'+(nkey(m.name)===nkey(draft.name)?' selected':'')+'>'+esc(m.name)+' ('+esc(m.team)+')</option>'}).join("")+'</select></div></div>'+
     '<div class="idpin"><label class="lbl" for="pk-pin">PIN</label><input class="field" id="pk-pin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="4 digits" value="'+esc(draft.pin)+'"></div></div>';
  h+='<p class="note idnote" id="pk-who">'+esc(whoNote())+'</p><p class="err" id="pk-err" hidden></p>';
  var out="",cur="";
  wk.games.forEach(function(g){var d=fmtDay(g.kickoff);if(d!==cur){if(cur)out+='</div>';out+='<h3 class="day">'+esc(d)+'</h3><div class="games">';cur=d}out+=gameCard(g)});
  if(cur)out+='</div>';
  h+=out;
  var tg=tbGame(wk);
  if(tg)h+='<div class="tb-card"><label class="lbl" for="pk-tb">Tiebreaker</label><p>Total points scored in '+tg.away+' @ '+tg.home+(tg.slot==="MNF"?' on Monday night':'')+'. If two people tie on correct picks, the closest guess wins the week.</p><input class="field" id="pk-tb" inputmode="numeric" maxlength="3" placeholder="e.g. 44" value="'+esc(draft.tb)+'"'+(locked(tg)?' disabled':'')+'></div>';
  return h;
}
function gameCard(g){
  var lk=locked(g),pick=draft.p[g.id];
  var meta='<div class="meta"><span>'+esc(fmtTime(g.kickoff))+'</span>'+(g.slot?'<span class="slot">'+esc(g.slot)+'</span>':'')+(lk?'<span class="lock">'+(g.winner?esc(resultText(g)):'Locked')+'</span>':'')+'</div>';
  return '<div class="game">'+meta+'<div class="mu">'+teamBtn(g,g.away,false,pick,lk)+'<span class="at" aria-hidden="true">@</span>'+teamBtn(g,g.home,true,pick,lk)+'</div></div>';
}
function teamBtn(g,c,home,pick,lk){
  var t=tm(c),on=pick===c;
  var cls="tm"+(home?" h":"")+(on?" on":(pick?" off":""));
  return '<button type="button" class="'+cls+'" data-g="'+g.id+'" data-t="'+c+'" style="'+tstyle(c)+'" aria-pressed="'+on+'"'+(lk?' disabled':'')+'><span class="ab">'+c+'</span><span class="nm">'+esc(t.name)+'</span></button>';
}
function dbNotice(){
  if(DB.err==="setup")return '<p class="note">Saving isn’t switched on yet, so the board is empty for now.</p>';
  if(DB.err==="load")return '<p class="err">Couldn’t reach the picks database. Check your connection and refresh.</p>';
  if(!DB.loaded)return '<p class="note">Loading picks…</p>';
  return '';
}
function viewBoard(){
  var weeks=Object.keys(S.weeks).map(Number).sort(function(a,b){return a-b});
  if(!S.weeks[String(boardWeek)])boardWeek=S.currentWeek;
  var h='';
  if(weeks.length>1)h+='<div class="wkchips" role="group" aria-label="Week">'+weeks.map(function(n){return '<button type="button" class="chip" data-act="bw" data-w="'+n+'" aria-pressed="'+(n===boardWeek)+'">Week '+n+'</button>'}).join("")+'</div>';
  var st=standings(boardWeek),wk=st.wk;
  var status=st.fin?'Final':st.decided?st.decided+' of '+wk.games.length+' games final':'Kicks off '+fmtShortDay(wk.games[0].kickoff);
  h+='<div class="sechd"><h2>Week '+boardWeek+' standings</h2><span class="pill">'+esc(status)+'</span></div>';
  h+=dbNotice();
  if(!st.rows.length){
    h+='<div class="empty"><b>No picks in yet</b>Make your picks on the Picks tab and tap Save. Everyone who’s in shows up here, and scores update as games go final.</div>';
    return h;
  }
  h+='<ol class="lb">'+st.rows.map(function(r){
    var isW=st.winners.indexOf(r.name)>=0,lead=!st.fin&&st.decided>0&&r.rank===1;
    var sub=(r.c+r.x)?r.c+' right, '+r.x+' wrong':r.n+' of '+wk.games.length+' picked';
    if(r.open&&(r.c+r.x))sub+=' · '+r.open+' to play';
    var tg=tbGame(wk);
    if(r.tb!=null&&r.tb!==""&&tg&&locked(tg))sub+=' · tiebreaker '+r.tb;
    return '<li class="'+(r.rank===1&&st.decided?'top':'')+'"><span class="rk">'+(st.decided?r.rank:'•')+'</span><div class="who"><div class="n"><span>'+esc(r.name)+'</span>'+(isW?'<span class="pill win">Week '+boardWeek+' winner</span>':lead?'<span class="pill">Leading</span>':'')+'</div><div class="s">'+esc((teamOf(r.name)?teamOf(r.name)+' \u00B7 ':'')+sub)+'</div></div><div class="score">'+r.c+'<small>correct</small></div></li>';
  }).join("")+'</ol>';
  h+='<h2 class="sec mt">Game by game</h2><p class="note">Everyone’s picks for a game show up once it kicks off.</p><div class="games">'+wk.games.map(function(g){return boardGame(g,st.entries)}).join("")+'</div>';
  return h;
}
function boardGame(g,entries){
  var by={},count=0;by[g.away]=[];by[g.home]=[];
  Object.keys(entries).forEach(function(n){var p=entries[n].p[g.id];if(p&&by[p]){by[p].push(n);count++}});
  var lk=locked(g);
  var r=g.winner?resultText(g):lk?'Waiting on the result':fmtShortDay(g.kickoff)+', '+fmtTime(g.kickoff);
  var head='<div class="gb-h"><span class="m">'+g.away+' @ '+g.home+'</span><span class="r">'+esc(r)+'</span></div>';
  if(!lk)return '<div class="gb">'+head+'<p class="hidden-picks">'+count+' pick'+(count===1?'':'s')+' in · revealed at kickoff</p></div>';
  function side(c){
    var cls='side'+(g.winner?(g.winner===c?' won':' lost'):''),has=by[c].length;
    return '<div class="'+cls+'"><span class="tchip" style="'+tstyle(c)+'">'+c+'</span><span class="names'+(has?'':' none')+'">'+(has?by[c].map(esc).join(", "):'No one')+'</span><span class="cnt">'+has+'</span></div>';
  }
  return '<div class="gb">'+head+side(g.away)+side(g.home)+'</div>';
}
function viewSeason(){
  var s=season();
  var h='<div class="sechd"><h2>'+S.season+' season</h2></div>'+dbNotice();
  if(!s.rows.length)return h+'<div class="empty"><b>The table starts with the first picks</b>Every correct pick counts toward your season total, and each week’s winner banks a weekly win.</div>';
  h+='<div class="tblwrap"><table><thead><tr><th scope="col">Player</th><th scope="col">Correct</th><th scope="col">Hit rate</th><th scope="col">Week wins</th></tr></thead><tbody>'+
    s.rows.map(function(r){var d=r.c+r.x;return '<tr><td>'+esc(r.name)+(teamOf(r.name)?'<span class="tm-sub">'+esc(teamOf(r.name))+'</span>':'')+'</td><td class="big">'+r.c+'</td><td>'+(d?Math.round(r.c/d*100)+'%':'–')+'</td><td>'+r.wins+'</td></tr>'}).join("")+'</tbody></table></div>';
  h+='<h2 class="sec mt">Weekly winners</h2>';
  h+=s.ww.length?'<ul class="wins">'+s.ww.slice().reverse().map(function(w){return '<li><span class="wn">Week '+w.n+'</span><span>'+w.names.map(esc).join(" & ")+' · '+w.c+' of '+w.of+'</span></li>'}).join("")+'</ul>':'<p class="note">The first weekly winner gets crowned once every Week '+S.currentWeek+' game is final.</p>';
  return h;
}
function renderBar(){
  var b=document.getElementById("bar");if(!b)return;
  if(tab!=="picks"){b.innerHTML="";return}
  var wk=W(),n=pickedCount(wk,draft.p),tot=wk.games.length;
  var label=saving?'Saving':db&&DB.loaded?'Save picks':'Copy my picks';
  var state=barMsg;
  if(!state&&DB.loaded&&n){state=unsaved()?'You have unsaved changes.':(playerIdFor(draft.name)?'All your picks are saved.':'')}
  b.innerHTML='<div class="bar"><div class="bar-in"><div class="prog"><b>'+n+'</b> of '+tot+' picked<div class="meter"><i style="width:'+Math.round(n/tot*100)+'%"></i></div></div><button type="button" class="go" data-act="save"'+(saving?' disabled':'')+'>'+label+'</button></div>'+(state?'<p class="bar-msg'+(barErr?' bad':'')+'" role="status">'+esc(state)+'</p>':'')+'</div>';
}
function renderLayer(){
  var l=document.getElementById("layer");if(!l)return;
  if(!sheet){l.innerHTML="";return}
  var wk=W(),left=wk.games.length-pickedCount(wk,draft.p),h="",tip="";
  if(sheet.kind==="saved"){
    h='Picks saved';
    tip='You’re on the board. Change any pick before its kickoff and save again.';
    if(left>0)tip+=' You still have '+left+' game'+(left===1?'':'s')+' open.';
    tip+=' Want to talk trash? Copy your picks into the group chat.';
  }else{
    h=sheet.copied===true?'Copied. Now paste it in the group chat.':sheet.copied===false?'Copy this message':'Your picks message';
    tip=sheet.copied===false?'Tap and hold the text, choose Select All, then Copy.':'Open the group chat, tap the message box and choose Paste.';
  }
  var copied=sheet.kind==="saved"&&sheet.copied===true?' Copied.':'';
  l.innerHTML='<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-h"><div class="sheet-in"><h2 id="sh-h">'+h+'</h2><p>'+esc(tip+copied)+'</p><textarea class="msgbox" id="sh-text" readonly rows="4">'+esc(sheet.text)+'</textarea><div class="row"><button type="button" class="btn" data-act="copy-again">'+(sheet.kind==="saved"?'Copy for the chat':'Copy again')+'</button><button type="button" class="go" data-act="close" id="sh-done">Done</button></div></div></div>';
}
function selectSheet(){var t=document.getElementById("sh-text");if(t){try{t.focus();t.select();t.setSelectionRange(0,t.value.length)}catch(e){}}}
function copyText(text){
  var done=function(ok){if(!sheet)return;sheet.copied=ok;renderLayer();if(!ok)selectSheet()};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){done(true)},function(){done(false)})}
    else setTimeout(function(){done(false)},0);
  }catch(e){setTimeout(function(){done(false)},0)}
}
function setTab(t){
  tab=t;barMsg="";barErr=false;
  renderTabs();renderView();renderBar();
  try{history.replaceState(null,"",t==="picks"?location.pathname:"#"+t)}catch(e){}
  var hd=app.querySelector(".hd");if(hd&&window.scrollY>hd.offsetHeight)window.scrollTo(0,hd.offsetHeight);
  if(t!=="picks"&&db&&Date.now()-DB.at>30000)refresh();
}
function refresh(){return loadDb().then(function(){if(tab!=="picks")renderView();else{var w=document.getElementById("pk-who");if(w)w.textContent=whoNote()}renderBar()})}
function showErr(m){var e=document.getElementById("pk-err");if(e){e.textContent=m;e.hidden=!m}}

/* ---------- saving ---------- */
function save(){
  var wk=W(),n=pickedCount(wk,draft.p);
  showErr("");barMsg="";barErr=false;
  if(!draft.name.trim()){showErr("Choose your name from the list first.");focusEl("pk-name");return}
  if(!n){barMsg="Pick at least one game first.";barErr=true;renderBar();return}
  if(!db||!DB.loaded){sheet={kind:"copy",text:buildMsg(),copied:null};copyText(sheet.text);renderLayer();return}
  if(!/^\d{4}$/.test(draft.pin)){showErr("Enter a 4-digit PIN. If you’re new, pick any 4 digits and remember them.");focusEl("pk-pin");return}
  var payload={};
  wk.games.forEach(function(g){if(!locked(g)&&draft.p[g.id])payload[g.id]=draft.p[g.id]});
  var tg=tbGame(wk);
  if(tg&&!locked(tg)&&draft.tb!=="")payload.tb=String(Number(draft.tb));
  if(!Object.keys(payload).length){barMsg="Those games have already kicked off.";barErr=true;renderBar();return}
  saving=true;renderBar();
  db.rpc("submit_picks",{p_name:draft.name.trim(),p_pin:draft.pin,p_season:S.season,p_week:S.currentWeek,p_picks:payload}).then(function(res){
    if(res.error)throw res.error;
    return loadDb().then(function(){
      saving=false;
      if(res.data&&res.data.name)draft.name=res.data.name;
      saveDraft();
      sheet={kind:"saved",text:buildMsg(),copied:null};
      renderView();renderBar();renderLayer();
      var d=document.getElementById("sh-done");if(d)d.focus({preventScroll:true});
    });
  }).catch(function(e){
    saving=false;
    var m=String((e&&(e.message||e.details))||"");
    if(m.indexOf("wrong_pin")>=0){showErr("That PIN doesn’t match the one "+draft.name.trim()+" used before. Ask Josh to reset it if you forgot.");focusEl("pk-pin")}
    else if(m.indexOf("bad_pin")>=0){showErr("Your PIN needs to be exactly 4 digits.");focusEl("pk-pin")}
    else if(m.indexOf("bad_name")>=0){showErr("Names can be up to 24 characters.");focusEl("pk-name")}
    else{barMsg="Couldn’t save. Check your connection and try again.";barErr=true}
    renderBar();
  });
}
function focusEl(id){var el=document.getElementById(id);if(el){el.scrollIntoView({block:"center"});el.focus({preventScroll:true})}}
function prefillFromServer(){
  if(!DB.loaded)return false;
  var sv=myServer();if(!sv)return false;
  var any=Object.keys(draft.p).length>0;
  if(any)return false;
  draft.p=Object.assign({},sv.p);if(draft.tb===""&&sv.tb!=null)draft.tb=String(sv.tb);
  saveDraft();return true;
}

/* ---------- events ---------- */
app.addEventListener("click",function(e){
  var b=e.target.closest("button,[data-act]");if(!b||!app.contains(b))return;
  if(b.dataset.tab){setTab(b.dataset.tab);return}
  if(b.dataset.g&&b.dataset.t&&!b.dataset.act){
    var g=b.dataset.g,t=b.dataset.t;
    if(draft.p[g]===t)delete draft.p[g];else draft.p[g]=t;
    var p=draft.p[g];
    app.querySelectorAll('.tm[data-g="'+g+'"]').forEach(function(btn){var on=p===btn.dataset.t;btn.classList.toggle("on",on);btn.classList.toggle("off",!!p&&!on);btn.setAttribute("aria-pressed",String(on))});
    saveDraft();barMsg="";barErr=false;renderBar();
    return;
  }
  var act=b.dataset.act;
  if(act==="save"){save()}
  else if(act==="copy-again"){if(sheet){sheet.copied=null;copyText(sheet.text);renderLayer()}}
  else if(act==="close"){sheet=null;renderLayer()}
  else if(act==="bw"){boardWeek=Number(b.dataset.w);renderView()}
});
app.addEventListener("input",function(e){
  var el=e.target;
  if(el.id==="pk-pin"){var d0=el.value.replace(/\D/g,"").slice(0,4);if(d0!==el.value)el.value=d0;draft.pin=d0;saveDraft();lsSet("pickem26-pin",d0);showErr("")}
  else if(el.id==="pk-tb"){var d=el.value.replace(/\D/g,"").slice(0,3);if(d!==el.value)el.value=d;draft.tb=d;saveDraft();renderBar()}
});
app.addEventListener("change",function(e){
  var el=e.target;if(el.id!=="pk-name")return;
  var prev=nkey(draft.name);
  draft.name=el.value;
  if(prev&&nkey(el.value)!==prev){draft.p={};draft.tb="";draft.pin=""}
  saveDraft();lsSet("pickem26-name",el.value);showErr("");
  prefillFromServer();renderView();renderBar();
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&sheet){sheet=null;renderLayer()}});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&db&&Date.now()-DB.at>30000)refresh()});

/* ---------- start ---------- */
function start(data){
  S=data;boardWeek=S.currentWeek;
  DKEY="pickem26-draft-w"+S.currentWeek;
  draft=lsGet(DKEY)||{};
  if(typeof draft.name!=="string")draft.name=lsGet("pickem26-name")||"";
  if(typeof draft.pin!=="string")draft.pin=lsGet("pickem26-pin")||"";
  if(!draft.p||typeof draft.p!=="object")draft.p={};
  if(draft.tb==null)draft.tb="";
  if(S.league&&S.league.length&&draft.name&&!member(draft.name)){draft.name="";draft.p={};draft.tb=""}
  if(member(draft.name))draft.name=member(draft.name).name;
  var h=(location.hash||"").replace("#","");
  if(h==="board"||h==="season")tab=h;
  initDb();
  renderShell();
  if(db)loadDb().then(function(){prefillFromServer();renderView();renderBar()});
  pollTimer=setInterval(function(){if(!document.hidden&&tab!=="picks"&&db)refresh()},60000);
}
fetch("state.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(start).catch(function(){
  var m=document.getElementById("loading");if(m)m.textContent="Couldn’t load this week’s games. Check your connection and refresh.";
});
})();
</script>

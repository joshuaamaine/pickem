<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NFL Pick'em 2026</title>
<meta name="description" content="Weekly NFL pick'em for the group chat. Tap your winners, paste them in the chat, and track the weekly and season standings.">
<meta property="og:type" content="website">
<meta property="og:title" content="NFL Pick'em 2026">
<meta property="og:description" content="Tap your winners for this week's games and paste them in the group chat.">
<meta property="og:url" content="https://joshuaamaine.github.io/pickem/">
<meta property="og:image" content="https://joshuaamaine.github.io/pickem/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#ECF0EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1210" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

:root{
  /* Layout: one phone-first column, sticky tab strip, fixed action bar at the bottom. Team colors are the loud element; everything else stays turf grey. */
  --bg:#ECF0EE;--surface:#FFFFFF;--sunk:#F3F6F4;--ink:#13201A;--muted:#5A6861;--line:#D1D9D4;
  --flag:#F2C230;--flag-ink:#2B2100;
  --good:#1B7548;--good-bg:#DCEFE3;--bad:#AD3A2E;--bad-bg:#F6E2DF;
  --scrim:rgba(12,22,17,.45);
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1210;--surface:#141C19;--sunk:#101714;--ink:#E5ECE8;--muted:#91A098;--line:#28332E;--flag:#F2C230;--flag-ink:#2B2100;--good:#5CC995;--good-bg:#132C22;--bad:#F07D70;--bad-bg:#371B18;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1210;--surface:#141C19;--sunk:#101714;--ink:#E5ECE8;--muted:#91A098;--line:#28332E;--flag:#F2C230;--flag-ink:#2B2100;--good:#5CC995;--good-bg:#132C22;--bad:#F07D70;--bad-bg:#371B18;--scrim:rgba(0,0,0,.6);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 160px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
.wrap{max-width:560px;margin-inline:auto}
.hd{padding-block:22px 0}
.eyebrow{margin:0;font:600 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand{margin:4px 0 0;font:900 66px/.88 var(--display);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.wkline{margin:12px 0 0;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;color:var(--muted);font-size:13px}
.wkno{font:800 22px/1 var(--display);color:var(--ink);text-transform:uppercase;letter-spacing:.02em}
.hash{margin-top:16px;height:9px;border-top:2px solid var(--line);background:repeating-linear-gradient(90deg,var(--line) 0 2px,transparent 2px 24px)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;padding-block:10px}
.tab{flex:1 1 0;min-width:0;padding:9px 4px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:600;font-size:14px}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.note{margin:0 0 10px;font-size:13px;color:var(--muted)}
.lede{margin:6px 0 16px;color:var(--muted);max-width:60ch}
.lbl{display:block;font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:16px}
.field:focus{border-color:var(--ink);outline:none}
textarea.field{resize:vertical;min-height:84px}
.err{margin:6px 0 0;color:var(--bad);font-size:13px}
.day{margin:22px 0 8px;font:800 20px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.games{display:flex;flex-direction:column;gap:10px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--muted);margin:0 2px 8px;font-variant-numeric:tabular-nums}
.slot{font:800 12px/1 var(--display);letter-spacing:.08em;padding:3px 6px;border-radius:4px;background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.lock{margin-left:auto;font-weight:600}
.mu{display:flex;align-items:stretch;gap:8px}
.at{align-self:center;font:800 18px var(--display);color:var(--muted)}
.tm{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--sunk);text-align:left;transition:background-color .15s,border-color .15s,opacity .15s}
.tm.h{align-items:flex-end;text-align:right}
.tm .ab{font:800 28px/.95 var(--display);letter-spacing:.02em}
.tm .nm{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tm:not(:disabled):hover{border-color:var(--muted)}
.tm.on{background:var(--tc);border-color:var(--tc);color:var(--tf)}
.tm.on .nm{color:var(--tf);opacity:.9}
.tm.off{opacity:.45}
.tm:disabled{cursor:default}
.tb-card{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tb-card p{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:560px;margin-inline:auto;display:flex;align-items:center;gap:12px}
.prog{flex:1 1 auto;min-width:0;font-size:13px;color:var(--muted)}
.prog b{font:800 22px/1 var(--display);color:var(--ink)}
.meter{margin-top:6px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--ink);transition:width .2s}
.bar-msg{max-width:560px;margin:6px auto 0;font-size:12.5px;color:var(--muted)}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.go{flex:0 0 auto;border:0;border-radius:10px;padding:13px 16px;background:var(--flag);color:var(--flag-ink);font:800 17px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.go:disabled{opacity:.55;cursor:default}
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:16px 16px 0 0;border-top:1px solid var(--line);padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font:800 26px/1.02 var(--display);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.sheet p{margin:0;color:var(--muted)}
.msgbox{width:100%;min-height:104px;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--sunk);font-size:15px;resize:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.mt{margin-top:28px}
.wkchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.sechd{display:flex;align-items:center;justify-content:space-between;gap:8px 10px;flex-wrap:wrap;margin:6px 0 12px}
.sechd h2,h2.sec{margin:0;font:800 24px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
h2.sec{margin-bottom:10px}
.pill{display:inline-block;padding:4px 9px;border-radius:999px;font:600 12px/1.2 var(--body);background:var(--sunk);border:1px solid var(--line);color:var(--muted);vertical-align:middle}
.pill.win{background:var(--flag);border-color:var(--flag);color:var(--flag-ink)}
.lb{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.lb li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.lb li:first-child{border-top:0}
.rk{font:800 20px var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.lb li.top .rk{color:var(--ink)}
.who{min-width:0}
.who .n{font-weight:600;overflow-wrap:anywhere;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.who .s{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.score{text-align:right;font:800 32px/1 var(--display);font-variant-numeric:tabular-nums}
.score small{display:block;font:500 11px var(--body);color:var(--muted)}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:800 20px/1.1 var(--display);text-transform:uppercase;margin-bottom:6px}
.gb{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.gb-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:2px}
.gb-h .m{font:800 18px var(--display);letter-spacing:.02em}
.gb-h .r{font-size:12.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.side{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 8px;border-radius:8px}
.side.won{background:var(--good-bg)}
.side.lost .names{text-decoration:line-through;text-decoration-color:var(--bad);color:var(--muted)}
.tchip{display:inline-block;min-width:48px;text-align:center;padding:5px 6px;border-radius:6px;background:var(--tc);color:var(--tf);font:800 15px/1 var(--display);letter-spacing:.04em}
.names{font-size:13.5px;overflow-wrap:anywhere}
.names.none{color:var(--muted)}
.cnt{font:800 17px var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.side.won .cnt{color:var(--good)}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th{border-top:0;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
th:first-child,td:first-child{text-align:left;white-space:normal;overflow-wrap:anywhere}
td.big{font:800 20px var(--display)}
.wins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.wins li{display:flex;gap:12px;align-items:baseline;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.wins .wn{font:800 16px var(--display);text-transform:uppercase;color:var(--muted);flex:0 0 auto}
.stack{display:flex;flex-direction:column;gap:12px}
.cm-row{display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.cm-row .meta{margin:0}
.cm-row .meta b{font:800 17px var(--display);color:var(--ink);letter-spacing:.02em}
.seg{display:flex;gap:6px}
.seg button{flex:1 1 0;min-width:0;padding:9px 6px;border-radius:8px;border:1.5px solid var(--line);background:var(--sunk);font:800 16px/1 var(--display);letter-spacing:.04em}
.seg button.on{background:var(--tc,var(--ink));border-color:var(--tc,var(--ink));color:var(--tf,var(--bg))}
.pl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pl .who{display:flex;flex-direction:column}
.pl .acts{display:flex;gap:6px;flex:0 0 auto}
.pl .btn{padding:8px 10px;font-size:13px}
.flash{margin:0 0 14px;padding:10px 12px;border-radius:10px;background:var(--good-bg);color:var(--good);font-weight:600;font-size:13.5px}
.cm-count{margin:16px 0 0;font-size:13px;color:var(--muted)}
@media (max-width:380px){.brand{font-size:56px}.tm .ab{font-size:24px}.go{padding:12px 12px;font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.loading{padding-block:22px}
</style>
</head>
<body>
<div id="app"><div class="wrap loading"><p class="eyebrow">NFL season · group chat pool</p><h1 class="brand">Pick’em</h1><p class="note" id="loading" role="status">Loading this week’s games…</p></div></div>
<script>
(function(){
"use strict";
var TEAMS={ARI:["Cardinals","#97233F","#FFFFFF"],ATL:["Falcons","#A71930","#FFFFFF"],BAL:["Ravens","#241773","#FFFFFF"],BUF:["Bills","#00338D","#FFFFFF"],CAR:["Panthers","#0085CA","#FFFFFF"],CHI:["Bears","#0B162A","#FFFFFF"],CIN:["Bengals","#FB4F14","#111111"],CLE:["Browns","#311D00","#FFFFFF"],DAL:["Cowboys","#003594","#FFFFFF"],DEN:["Broncos","#FB4F14","#0A2343"],DET:["Lions","#0076B6","#FFFFFF"],GB:["Packers","#203731","#FFB612"],HOU:["Texans","#03202F","#FFFFFF"],IND:["Colts","#002C5F","#FFFFFF"],JAC:["Jaguars","#006778","#FFFFFF"],KC:["Chiefs","#E31837","#FFFFFF"],LV:["Raiders","#101010","#C9CED1"],LAC:["Chargers","#0080C6","#FFFFFF"],LA:["Rams","#003594","#FFD100"],MIA:["Dolphins","#008E97","#FFFFFF"],MIN:["Vikings","#4F2683","#FFC62F"],NE:["Patriots","#002244","#FFFFFF"],NO:["Saints","#D3BC8D","#101820"],NYG:["Giants","#0B2265","#FFFFFF"],NYJ:["Jets","#125740","#FFFFFF"],PHI:["Eagles","#004C54","#FFFFFF"],PIT:["Steelers","#FFB612","#101820"],SF:["49ers","#AA0000","#FFFFFF"],SEA:["Seahawks","#002244","#69BE28"],TB:["Buccaneers","#D50A0A","#FFFFFF"],TEN:["Titans","#0C2340","#FFFFFF"],WAS:["Commanders","#5A1414","#FFB612"]};
var app=document.getElementById("app");
var S=null,tab="picks",boardWeek=0,sheet=null,barMsg="",draft=null,DKEY="";

function W(n){return S.weeks[String(n==null?S.currentWeek:n)]}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function saveDraft(){lsSet(DKEY,draft)}
function tm(c){var t=TEAMS[c]||[c,"#55605B","#FFFFFF"];return {code:c,name:t[0],bg:t[1],fg:t[2]}}
function tstyle(c){var t=tm(c);return '--tc:'+t.bg+';--tf:'+t.fg}
function locked(g){return Date.now()>=Date.parse(g.kickoff)}
function fmtDay(iso){return new Date(iso).toLocaleDateString([], {weekday:"long",month:"short",day:"numeric"})}
function fmtShortDay(iso){return new Date(iso).toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"})}
function fmtShort(iso){return new Date(iso).toLocaleDateString([], {month:"short",day:"numeric"})}
function fmtTime(iso){return new Date(iso).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}
function tbGame(wk){for(var i=0;i<wk.games.length;i++){if(wk.games[i].id===wk.tiebreaker)return wk.games[i]}return null}
function hasScore(g){return g.as!=null&&g.hs!=null}
function resultText(g){var sc=hasScore(g)?" "+Math.max(g.as,g.hs)+"-"+Math.min(g.as,g.hs):"";return g.winner==="TIE"?"Tie"+sc:g.winner+" won"+sc}
function pickedCount(wk,p){return wk.games.filter(function(g){return p[g.id]}).length}

/* ---------- scoring ---------- */
function standings(n){
  var wk=W(n);
  var decided=wk.games.filter(function(g){return g.winner}).length;
  var fin=decided===wk.games.length;
  var picks=wk.picks||{};
  var rows=Object.keys(picks).map(function(name){
    var e=picks[name],c=0,x=0,open=0;
    wk.games.forEach(function(g){var p=e.p[g.id];if(!p)return;if(!g.winner){open++;return}if(p===g.winner)c++;else x++});
    var diff=(wk.mnfTotal!=null&&e.tb!=null&&e.tb!=="")?Math.abs(Number(e.tb)-wk.mnfTotal):null;
    return {name:name,c:c,x:x,open:open,tb:e.tb,diff:diff};
  });
  function dv(r){return r.diff==null?1e9:r.diff}
  rows.sort(function(a,b){if(b.c!==a.c)return b.c-a.c;if(dv(a)!==dv(b))return dv(a)-dv(b);return a.name.localeCompare(b.name)});
  rows.forEach(function(r,i){if(i===0){r.rank=1;return}var p=rows[i-1];r.rank=(p.c===r.c&&dv(p)===dv(r))?p.rank:i+1});
  var winners=fin&&rows.length?rows.filter(function(r){return r.rank===1}).map(function(r){return r.name}):[];
  return {wk:wk,rows:rows,decided:decided,fin:fin,winners:winners};
}
function season(){
  var m={},ww=[];
  Object.keys(S.weeks).map(Number).sort(function(a,b){return a-b}).forEach(function(n){
    var st=standings(n);
    st.rows.forEach(function(r){var k=r.name.toLowerCase();var o=m[k]||(m[k]={name:r.name,c:0,x:0,wins:0});o.name=r.name;o.c+=r.c;o.x+=r.x});
    if(st.fin&&st.winners.length){st.winners.forEach(function(w){m[w.toLowerCase()].wins++});ww.push({n:n,names:st.winners,c:st.rows[0].c,of:st.wk.games.length})}
  });
  var rows=Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.c-a.c||b.wins-a.wins||a.name.localeCompare(b.name)});
  return {rows:rows,ww:ww};
}
function buildMsg(){
  var wk=W(),codes=wk.games.filter(function(g){return draft.p[g.id]}).map(function(g){return draft.p[g.id]});
  var s="🏈 Week "+S.currentWeek+" picks, "+draft.name.trim()+"\n"+codes.join(", ");
  var tg=tbGame(wk);
  if(draft.tb!==""&&tg)s+="\n"+(tg.slot==="MNF"?"MNF total: ":"Tiebreaker total: ")+draft.tb;
  return s;
}

/* ---------- rendering ---------- */
function weekRange(wk){var x=fmtShort(wk.games[0].kickoff),y=fmtShort(wk.games[wk.games.length-1].kickoff);return x===y?x:x+" to "+y}
function renderShell(){
  var wk=W();
  app.innerHTML='<div class="wrap">'+
    '<header class="hd"><p class="eyebrow">'+S.season+' NFL season · group chat pool</p><h1 class="brand">Pick’em</h1>'+
    '<p class="wkline"><span class="wkno">Week '+S.currentWeek+'</span><span>'+esc(weekRange(wk))+'</span><span>'+wk.games.length+' games</span>'+(wk.byes&&wk.byes.length?'<span>On bye: '+esc(wk.byes.join(", "))+'</span>':'')+'</p>'+
    '<div class="hash" aria-hidden="true"></div></header>'+
    '<nav class="tabs" role="tablist" id="tabs"></nav>'+
    '<main id="view"></main></div><div id="bar"></div><div id="layer"></div>';
  renderTabs();renderView();renderBar();renderLayer();
}
function renderTabs(){
  var nav=document.getElementById("tabs");if(!nav)return;
  nav.innerHTML=[["picks","Picks"],["board","Board"],["season","Season"]].map(function(x){return '<button type="button" class="tab" role="tab" data-tab="'+x[0]+'" aria-selected="'+(tab===x[0])+'">'+x[1]+'</button>'}).join("");
}
function renderView(){
  var v=document.getElementById("view");if(!v)return;
  v.innerHTML=tab==="board"?viewBoard():tab==="season"?viewSeason():viewPicks();
}
function viewPicks(){
  var wk=W();
  var h='<p class="lede">Tap who you think wins each game. When you’re done, copy your picks and paste them in the group chat. Picks lock at each game’s kickoff.</p>';
  h+='<label class="lbl" for="pk-name">Your name</label><input class="field" id="pk-name" autocomplete="nickname" maxlength="24" placeholder="The name the group knows you by" value="'+esc(draft.name)+'"><p class="err" id="pk-name-err" hidden>Add your name so everyone knows whose picks these are.</p>';
  var out="",cur="";
  wk.games.forEach(function(g){var d=fmtDay(g.kickoff);if(d!==cur){if(cur)out+='</div>';out+='<h3 class="day">'+esc(d)+'</h3><div class="games">';cur=d}out+=gameCard(g)});
  if(cur)out+='</div>';
  h+=out;
  var tg=tbGame(wk);
  if(tg)h+='<div class="tb-card"><label class="lbl" for="pk-tb">Tiebreaker</label><p>Total points scored in '+tg.away+' @ '+tg.home+(tg.slot==="MNF"?' on Monday night':'')+'. If two people tie on correct picks, the closest guess wins the week.</p><input class="field" id="pk-tb" inputmode="numeric" maxlength="3" placeholder="e.g. 44" value="'+esc(draft.tb)+'"></div>';
  return h;
}
function gameCard(g){
  var lk=locked(g),pick=draft.p[g.id];
  var meta='<div class="meta"><span>'+esc(fmtTime(g.kickoff))+'</span>'+(g.slot?'<span class="slot">'+esc(g.slot)+'</span>':'')+(lk?'<span class="lock">'+(g.winner?esc(resultText(g)):'Locked')+'</span>':'')+'</div>';
  return '<div class="game">'+meta+'<div class="mu">'+teamBtn(g,g.away,false,pick,lk)+'<span class="at" aria-hidden="true">@</span>'+teamBtn(g,g.home,true,pick,lk)+'</div></div>';
}
function teamBtn(g,c,home,pick,lk){
  var t=tm(c),on=pick===c;
  var cls="tm"+(home?" h":"")+(on?" on":(pick?" off":""));
  return '<button type="button" class="'+cls+'" data-g="'+g.id+'" data-t="'+c+'" style="'+tstyle(c)+'" aria-pressed="'+on+'"'+(lk?' disabled':'')+'><span class="ab">'+c+'</span><span class="nm">'+esc(t.name)+'</span></button>';
}
function viewBoard(){
  var weeks=Object.keys(S.weeks).map(Number).sort(function(a,b){return a-b});
  if(!S.weeks[String(boardWeek)])boardWeek=S.currentWeek;
  var h='';
  if(weeks.length>1)h+='<div class="wkchips" role="group" aria-label="Week">'+weeks.map(function(n){return '<button type="button" class="chip" data-act="bw" data-w="'+n+'" aria-pressed="'+(n===boardWeek)+'">Week '+n+'</button>'}).join("")+'</div>';
  var st=standings(boardWeek),wk=st.wk;
  var status=st.fin?'Final':st.decided?st.decided+' of '+wk.games.length+' games final':'Kicks off '+fmtShortDay(wk.games[0].kickoff);
  h+='<div class="sechd"><h2>Week '+boardWeek+' standings</h2><span class="pill">'+esc(status)+'</span></div>';
  if(!st.rows.length){
    h+='<div class="empty"><b>No picks on the board yet</b>Make your picks on the Picks tab and paste them in the group chat. Everyone’s picks show up here with a running score once the commish posts them.</div>';
    return h;
  }
  h+='<ol class="lb">'+st.rows.map(function(r){
    var isW=st.winners.indexOf(r.name)>=0,lead=!st.fin&&st.decided>0&&r.rank===1;
    var sub=(r.c+r.x)?r.c+' right, '+r.x+' wrong':'No games final yet';
    if(r.open)sub+=' · '+r.open+' to play';
    if(r.tb!=null&&r.tb!=="")sub+=' · tiebreaker '+r.tb;
    return '<li class="'+(r.rank===1?'top':'')+'"><span class="rk">'+r.rank+'</span><div class="who"><div class="n"><span>'+esc(r.name)+'</span>'+(isW?'<span class="pill win">Week '+boardWeek+' winner</span>':lead?'<span class="pill">Leading</span>':'')+'</div><div class="s">'+esc(sub)+'</div></div><div class="score">'+r.c+'<small>correct</small></div></li>';
  }).join("")+'</ol>';
  h+='<h2 class="sec mt">Game by game</h2><div class="games">'+wk.games.map(function(g){return boardGame(g,wk)}).join("")+'</div>';
  return h;
}
function boardGame(g,wk){
  var by={};by[g.away]=[];by[g.home]=[];
  Object.keys(wk.picks).forEach(function(n){var p=wk.picks[n].p[g.id];if(p&&by[p])by[p].push(n)});
  var r=g.winner?resultText(g):locked(g)?'Waiting on the result':fmtShortDay(g.kickoff)+', '+fmtTime(g.kickoff);
  function side(c){
    var cls='side'+(g.winner?(g.winner===c?' won':' lost'):''),has=by[c].length;
    return '<div class="'+cls+'"><span class="tchip" style="'+tstyle(c)+'">'+c+'</span><span class="names'+(has?'':' none')+'">'+(has?by[c].map(esc).join(", "):'No one')+'</span><span class="cnt">'+has+'</span></div>';
  }
  return '<div class="gb"><div class="gb-h"><span class="m">'+g.away+' @ '+g.home+'</span><span class="r">'+esc(r)+'</span></div>'+side(g.away)+side(g.home)+'</div>';
}
function viewSeason(){
  var s=season();
  var h='<div class="sechd"><h2>'+S.season+' season</h2></div>';
  if(!s.rows.length)return h+'<div class="empty"><b>The table starts with the first picks</b>Every correct pick counts toward your season total, and each week’s winner banks a weekly win.</div>';
  h+='<div class="tblwrap"><table><thead><tr><th scope="col">Player</th><th scope="col">Correct</th><th scope="col">Hit rate</th><th scope="col">Week wins</th></tr></thead><tbody>'+
    s.rows.map(function(r){var d=r.c+r.x;return '<tr><td>'+esc(r.name)+'</td><td class="big">'+r.c+'</td><td>'+(d?Math.round(r.c/d*100)+'%':'–')+'</td><td>'+r.wins+'</td></tr>'}).join("")+'</tbody></table></div>';
  h+='<h2 class="sec mt">Weekly winners</h2>';
  h+=s.ww.length?'<ul class="wins">'+s.ww.slice().reverse().map(function(w){return '<li><span class="wn">Week '+w.n+'</span><span>'+w.names.map(esc).join(" & ")+' · '+w.c+' of '+w.of+'</span></li>'}).join("")+'</ul>':'<p class="note">The first weekly winner gets crowned once every Week '+S.currentWeek+' game is final.</p>';
  return h;
}
function renderBar(){
  var b=document.getElementById("bar");if(!b)return;
  if(tab!=="picks"){b.innerHTML="";return}
  var wk=W(),n=pickedCount(wk,draft.p),tot=wk.games.length;
  b.innerHTML='<div class="bar"><div class="bar-in"><div class="prog"><b>'+n+'</b> of '+tot+' picked<div class="meter"><i style="width:'+Math.round(n/tot*100)+'%"></i></div></div><button type="button" class="go" data-act="copy">Copy my picks</button></div>'+(barMsg?'<p class="bar-msg" role="status">'+esc(barMsg)+'</p>':'')+'</div>';
}
function renderLayer(){
  var l=document.getElementById("layer");if(!l)return;
  if(!sheet){l.innerHTML="";return}
  var wk=W(),left=wk.games.length-pickedCount(wk,draft.p);
  var head=sheet.copied===true?'Copied. Now paste it in the group chat.':sheet.copied===false?'Copy this message':'Your picks message';
  var tip=sheet.copied===false?'Tap and hold the text, choose Select All, then Copy. Paste it in the group chat.':'Open the group chat, tap the message box and choose Paste.';
  if(left>0)tip+=' You left '+left+' game'+(left===1?'':'s')+' blank.';
  l.innerHTML='<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-h"><div class="sheet-in"><h2 id="sh-h">'+head+'</h2><p>'+esc(tip)+'</p><textarea class="msgbox" id="sh-text" readonly rows="4">'+esc(sheet.text)+'</textarea><div class="row"><button type="button" class="btn" data-act="copy-again">Copy again</button><button type="button" class="go" data-act="close" id="sh-done">Done</button></div></div></div>';
}
function selectSheet(){var t=document.getElementById("sh-text");if(t){try{t.focus();t.select();t.setSelectionRange(0,t.value.length)}catch(e){}}}
function copyText(text){
  var done=function(ok){if(!sheet)return;sheet.copied=ok;renderLayer();if(!ok)selectSheet()};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){done(true)},function(){done(false)})}
    else setTimeout(function(){done(false)},0);
  }catch(e){setTimeout(function(){done(false)},0)}
}
function setTab(t){
  tab=t;barMsg="";
  renderTabs();renderView();renderBar();
  try{history.replaceState(null,"",t==="picks"?location.pathname:"#"+t)}catch(e){}
  var hd=app.querySelector(".hd");if(hd&&window.scrollY>hd.offsetHeight)window.scrollTo(0,hd.offsetHeight);
}

/* ---------- events ---------- */
app.addEventListener("click",function(e){
  var b=e.target.closest("button,[data-act]");if(!b||!app.contains(b))return;
  if(b.dataset.tab){setTab(b.dataset.tab);return}
  if(b.dataset.g&&b.dataset.t&&!b.dataset.act){
    var g=b.dataset.g,t=b.dataset.t;
    if(draft.p[g]===t)delete draft.p[g];else draft.p[g]=t;
    var p=draft.p[g];
    app.querySelectorAll('.tm[data-g="'+g+'"]').forEach(function(btn){var on=p===btn.dataset.t;btn.classList.toggle("on",on);btn.classList.toggle("off",!!p&&!on);btn.setAttribute("aria-pressed",String(on))});
    saveDraft();barMsg="";renderBar();
    return;
  }
  var act=b.dataset.act;
  if(act==="copy"){
    if(!draft.name.trim()){var er=document.getElementById("pk-name-err");if(er)er.hidden=false;var ni=document.getElementById("pk-name");if(ni){ni.scrollIntoView({block:"center"});ni.focus({preventScroll:true})}return}
    if(!pickedCount(W(),draft.p)){barMsg="Pick at least one game first.";renderBar();return}
    sheet={text:buildMsg(),copied:null};
    copyText(sheet.text);
    renderLayer();
    var d=document.getElementById("sh-done");if(d)d.focus({preventScroll:true});
  }else if(act==="copy-again"){if(sheet){sheet.copied=null;copyText(sheet.text);renderLayer()}}
  else if(act==="close"){sheet=null;renderLayer()}
  else if(act==="bw"){boardWeek=Number(b.dataset.w);renderView()}
});
app.addEventListener("input",function(e){
  var el=e.target;
  if(el.id==="pk-name"){draft.name=el.value;saveDraft();lsSet("pickem26-name",el.value);var er=document.getElementById("pk-name-err");if(er)er.hidden=true}
  else if(el.id==="pk-tb"){var d=el.value.replace(/\D/g,"").slice(0,3);if(d!==el.value)el.value=d;draft.tb=d;saveDraft()}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&sheet){sheet=null;renderLayer()}});

/* ---------- start ---------- */
function start(data){
  S=data;boardWeek=S.currentWeek;
  DKEY="pickem26-draft-w"+S.currentWeek;
  draft=lsGet(DKEY)||{};
  if(typeof draft.name!=="string")draft.name=lsGet("pickem26-name")||"";
  if(!draft.p||typeof draft.p!=="object")draft.p={};
  if(draft.tb==null)draft.tb="";
  var h=(location.hash||"").replace("#","");
  if(h==="board"||h==="season")tab=h;
  renderShell();
}
fetch("state.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(start).catch(function(){
  var m=document.getElementById("loading");if(m)m.textContent="Couldn’t load this week’s games. Check your connection and refresh.";
});
})();
</script>
</body>
</html>
